
name: Actualizar GeoJSON AAA DMC

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-aaa
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Actualizar datos AAA
        run: python scripts/actualizar_aaa.py

      - name: Publicar GeoJSON actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eventos_AAA.geojson

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar polígonos AAA DMC"
            git push
          else
            echo "Sin cambios en los datos AAA"
          fi
